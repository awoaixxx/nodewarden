name: Deploy to Cloudflare Workers

# Manual only. Push deploys are handled by the Cloudflare Workers Git
# integration (connected to this repo in the Cloudflare dashboard).
# Run this by hand only after CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# secrets have been added to the repo.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nodewarden
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy with Wrangler
        run: npx wrangler deploy -c wrangler.kv.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify Worker is up
        run: |
          curl -sf https://nodewarden.xqwzka.workers.dev/api/config | head -c 300
          echo
          curl -sf -o /dev/null -w "homepage HTTP %{http_code}\n" https://nodewarden.xqwzka.workers.dev/
